[workspace]
members = [
    ".",
    "crates/sena-core",
    "crates/sena-gateway",
    "crates/sena-local",
    "crates/sena-collab",
    "crates/sena-security",
    "crates/sena-observe",
    "crates/sena-mcp",
    "crates/sena-providers",
]
exclude = ["sena-ui/src-tauri"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
# Core async
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging/Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.13"

# Network
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
axum = { version = "0.7", features = ["macros"] }
hyper = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util", "retry", "timeout", "limit"] }

# Caching
moka = { version = "0.12", features = ["future"] }

# Vector DB
qdrant-client = "1.12"
fastembed = "4"

# Security
aes-gcm = "0.10"
keyring = "3"
sha2 = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
base64 = "0.22"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
parking_lot = "0.12"
bytes = "1"
rand = "0.8"
regex = "1"
once_cell = "1.20"
pin-project-lite = "0.2"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-rusqlite = "0.6"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Internal crates
sena-core = { path = "crates/sena-core", version = "1.0.0" }
sena-gateway = { path = "crates/sena-gateway", version = "1.0.0" }
sena-local = { path = "crates/sena-local", version = "1.0.0" }
sena-collab = { path = "crates/sena-collab", version = "1.0.0" }
sena-security = { path = "crates/sena-security", version = "1.0.0" }
sena-observe = { path = "crates/sena-observe", version = "1.0.0" }
sena-mcp = { path = "crates/sena-mcp", version = "1.0.0" }

[package]
name = "sena1996-ai"
version = "1.0.0"
edition = "2021"
authors = ["Sena1996 <sena1996@github.com>"]
description = "Sena1996 AI Tool - Make Your AI Collaborative and Smarter"
license = "MIT"
repository = "https://github.com/Sena1996/Sena1996-AI"
keywords = ["ai", "collaboration", "network", "claude", "mcp", "intelligence"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "sena1996_ai"
path = "src/lib.rs"

[[bin]]
name = "sena"
path = "src/main.rs"

[dependencies]
# Core infrastructure (new crates)
sena-core = { workspace = true }
sena-gateway = { workspace = true }
sena-local = { workspace = true }
sena-collab = { workspace = true }
sena-security = { workspace = true }
sena-observe = { workspace = true }
sena-mcp = { workspace = true }

# Temporary - will be replaced in later phases
sena-providers = { version = "1.0.0", path = "crates/sena-providers" }

# Core dependencies (use workspace)
tokio = { workspace = true, features = ["signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

# Utilities (use workspace)
chrono = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }

# Network (use workspace)
reqwest = { workspace = true }

# CLI (use workspace)
clap = { workspace = true }

# Additional dependencies (not in workspace)
hex = "0.4"
log = "0.4"
env_logger = "0.11"
indexmap = { version = "2.0", features = ["serde"] }
dirs = "5.0"
hostname = "0.4"
whoami = "1.5"
toml = "0.9"
jsonrpc-core = "18.0"
atty = "0.2"
colored = "2.1"
mdns-sd = "0.11"
tokio-rustls = "0.25"
rustls = "0.22"
rustls-pemfile = "2.0"
rcgen = "0.14"
glob = "0.3"

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
