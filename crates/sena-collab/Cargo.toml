[package]
name = "sena-collab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors = ["Sena1996 <sena1996@github.com>"]
description = "AI-to-AI Collaboration Framework for Sena1996 AI Tool"
repository = "https://github.com/Sena1996/Sena1996-AI"
keywords = ["ai", "collaboration", "multi-agent", "orchestration"]

[dependencies]
# Core dependencies
sena-core = { workspace = true }

# Async/concurrency
async-trait = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
futures = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
dirs = "5.0"

# WebSocket
tokio-tungstenite = "0.24"

# System
libc = "0.2"

# Temporary - will be refactored in Phase 3
sena-providers = { version = "1.0.0", path = "../sena-providers" }

[dev-dependencies]
tokio-test = "0.4"
