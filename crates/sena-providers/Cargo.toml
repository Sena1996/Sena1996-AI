[package]
name = "sena-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors = ["Sena1996 <sena1996@github.com>"]
description = "Multi-AI provider integration for Sena1996 AI Tool"
repository = "https://github.com/Sena1996/Sena1996-AI"
keywords = ["ai", "llm", "claude", "openai", "gemini", "ollama"]

[features]
default = ["claude", "openai", "gemini", "ollama"]
claude = []
openai = []
gemini = []
ollama = []
mistral = []
all-providers = ["claude", "openai", "gemini", "ollama", "mistral"]

[dependencies]
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
futures = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true }
pin-project-lite = { workspace = true }
tokio-stream = "0.1"
toml = "0.9"
dirs-next = "2.0"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
