[workspace]

[package]
name = "sena-ui"
version = "1.0.0"
description = "SENA AI Collaboration Hub Desktop Application"
authors = ["Sena1996"]
license = "MIT"
repository = "https://github.com/Sena1996/Sena1996-AI"
edition = "2021"

[lib]
name = "sena_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "5.0"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
base64 = "0.22"
hostname = "0.4"
chrono = { version = "0.4", features = ["serde"] }

# Core SENA crates (new architecture)
sena-core = { path = "../../crates/sena-core" }
sena-gateway = { path = "../../crates/sena-gateway" }
sena-collab = { path = "../../crates/sena-collab" }
sena-security = { path = "../../crates/sena-security" }
sena-observe = { path = "../../crates/sena-observe" }

# Temporary - for config structs only, will be removed
sena-providers = { path = "../../crates/sena-providers" }

keyring = "3"
toml = "0.8"
reqwest = { version = "0.12", features = ["json"] }
open = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
